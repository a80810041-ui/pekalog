<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEKALOG 更新</title>
<style>
body{margin:0;background:#0b0f14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
.card{width:min(430px,100%);background:#141a23;border:1px solid #344052;border-radius:22px;padding:22px;box-sizing:border-box}
h1{font-size:24px;margin:0 0 10px}p{color:#b8c2cf;line-height:1.7}
button{width:100%;padding:15px;border:0;border-radius:14px;background:#75ddf5;color:#071017;font-size:17px;font-weight:900}
.small{font-size:12px;color:#8e9bab;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>🧹 PEKALOG 更新</h1>
<p>古いPEKALOGのキャッシュだけ外します。<br><strong>実戦データやLABのlocalStorageは削除しません。</strong></p>
<button id="go">最新版へ更新する</button>
<div id="s" class="small"></div>
</div>
<script>
document.getElementById('go').onclick=async()=>{
 const s=document.getElementById('s');
 s.textContent='古いキャッシュを外しています…';
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){}
 s.textContent='完了。最新版を開きます…';
 setTimeout(()=>location.replace('./?v=351-'+Date.now()),250);
};
</script>
</body></html>
