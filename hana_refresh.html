<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07160f">
<title>HANA LOG 更新リセット</title>
<style>
body{margin:0;background:#07100c;color:#f5fff8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(560px,100%);background:#0d1b14;border:1px solid #2b5038;border-radius:20px;padding:22px;box-sizing:border-box;box-shadow:0 16px 50px rgba(0,0,0,.35)}
h1{font-size:26px;margin:0 0 10px}.muted{color:#a9c1b0;font-size:14px;line-height:1.7}.status{margin-top:16px;padding:14px;border-radius:14px;background:#09150f;border:1px solid #31503b;line-height:1.6}.ok{color:#73f4a1}.bad{color:#ff9090}button{width:100%;margin-top:16px;border:1px solid #2ba85f;background:#1f7b49;color:#fff;border-radius:14px;padding:15px 12px;font-size:17px;font-weight:800}
</style>
</head>
<body>
<div class="card">
<h1>🌺 HANA LOG 更新リセット</h1>
<div class="muted">保存データ（localStorage）は消さずに、古いService WorkerとCache Storageだけ解除して最新版を読み直します。</div>
<div id="status" class="status">準備中…</div>
<button id="go">最新版HANA LOGを開く</button>
</div>
<script>
(async()=>{
 const s=document.getElementById('status');
 let msgs=[];
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
     msgs.push(`Service Worker解除: ${regs.length}件`);
   }else msgs.push('Service Worker: 対象なし');
 }catch(e){msgs.push('Service Worker解除で警告: '+e.message)}
 try{
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
     msgs.push(`Cache削除: ${keys.length}件`);
   }else msgs.push('Cache Storage: 対象なし');
 }catch(e){msgs.push('Cache削除で警告: '+e.message)}
 s.innerHTML='<span class="ok">✅ リセット完了</span><br>'+msgs.join('<br>')+'<br><small>実戦ログやLAB蓄積データは削除していません。</small>';
})();
document.getElementById('go').onclick=()=>{
 location.href='./hana_photo_v16_lab.html?v=200&ts='+Date.now();
};
</script>
</body>
</html>
