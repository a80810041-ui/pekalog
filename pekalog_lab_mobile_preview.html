<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>PEKALOG 12 mini コンパクト画面</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0d10;color:#eff5fc;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}main{height:100dvh;max-width:500px;margin:auto;padding:calc(env(safe-area-inset-top) + 9px) 12px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;gap:8px;overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;gap:7px}h1{font-size:18px;margin:0}.sub,small{color:#adbac9;font-size:11px}.card{background:#151d29;border:1px solid #303d4e;border-radius:13px;padding:9px}button{border:1px solid #405168;background:#263448;color:#e8f5ff;border-radius:10px;padding:10px 8px;font-weight:700;cursor:pointer}button.primary{color:#092b32;background:#7de3ff;border-color:#7de3ff}.tabs{display:flex;gap:7px}.tabs button{flex:1}.tabs .on{background:#256f66;border-color:#75dfbd}input{background:#101924;color:white;border:1px solid #52657b;border-radius:8px;padding:7px;font-size:12px;width:135px}textarea{display:none;width:100%;height:75px;background:#0c141d;border:1px solid #506276;border-radius:9px;color:white;padding:8px;font-size:11px;margin-top:7px}textarea.show{display:block}.candidates{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}.candidate{border:1px solid #364458;background:#172334;border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:8px;align-items:center}.candidate b{font-size:16px}.candidate strong{font-size:23px;color:#7de3ff}.actions button{flex:1;font-size:12px;padding:10px 4px}.status{font-size:11px;color:#a6bed2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{font-size:10px;color:#a1b2c4}#importActions{display:none;margin-top:6px}#importActions button{width:100%}@media(max-height:690px){main{gap:5px}.card{padding:6px}.candidate{padding:7px}.note{font-size:9px}}
</style></head><body><main><div class="row"><div><h1>🌺 PEKALOG LAB</h1><div class="sub">iPhone 12 mini｜375 × 812 pt</div></div><span class="sub">試用画面 v1</span></div><div class="tabs"><button id="morning" class="on">🌅 朝イチ狙い</button><button id="live">☀️ 途中参戦</button></div><div class="card"><div class="row"><span class="sub">対象日</span><input type="date" id="day"><button id="analyze" class="primary">再分析</button></div><div class="status" id="description" style="margin-top:6px">前日までの閉店データを使う</div></div><div class="card"><div class="row"><b style="font-size:13px">📥 収集JSONを読み込む</b><button id="toggle">貼り付け</button><label class="sub" style="cursor:pointer">📁 ファイル<input type="file" accept=".json" id="file" hidden></label></div><textarea id="paste" placeholder="収集JSON またはLABバックアップJSONを貼り付け"></textarea><div id="importActions"><button id="import" class="primary">このデータを分析用に取り込む</button></div><div class="status" id="status" style="margin-top:5px">保存済データは消さずに追加します</div></div><div class="row"><b style="font-size:13px">🏅 おすすめ候補 TOP 3</b><span class="sub">暫定相対スコア</span></div><div id="results" class="candidates"><div class="candidate">JSONを取り込むと候補を表示します</div></div><div id="warning" class="status">※ データの鮮度を確認してください</div><div class="row actions"><button id="save" class="primary">📌 予想保存</button><button id="export">⬇ 履歴出力</button><button id="clear">🧹 画面消去</button></div><div class="note">この画面は独立した試用版です。既存のLAB・GitHubは変更しません。候補は暫定評価で的中や利益を保証しません。</div></main><script>
const $=x=>document.getElementById(x);const MACHINES=['651','652','653','655','656','657','658','660','661','662','663','707','708','710','711','712','713','715','716','717','718','720','687'];const SKEY='pekalog_compact_data_v1',PKEY='pekalog_compact_pred_v1';let mode='morning',records=load(SKEY,[]),last=[];function load(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())} $('day').value=today();const N=x=>x==null||x===''?0:Number(x)||0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const age=(a,b)=>Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);const final=r=>r.isFinal===true||r.snapshotType==='historical-final';function setMode(m){mode=m;$('morning').classList.toggle('on',m==='morning');$('live').classList.toggle('on',m==='live');$('description').textContent=m==='morning'?'前日までの閉店データを使う':'当日のLIVEデータも加えて評価';analyze()}$('morning').onclick=()=>setMode('morning');$('live').onclick=()=>setMode('live');$('analyze').onclick=analyze;$('day').onchange=analyze;$('toggle').onclick=()=>{let on=$('paste').classList.toggle('show');$('importActions').style.display=on?'block':'none'};
function convert(obj){if(Array.isArray(obj))return obj;if(Array.isArray(obj.snapshots))return obj.snapshots;if(obj.kind==='pekalog-turkey-bundle'&&Array.isArray(obj.machines)){const out=[];for(const m of obj.machines){const machine=String(m.machine||'').replace(/\D/g,'');const stats=m.stats||{};for(const [offset,k] of [[0,'today'],[1,'prev1'],[2,'prev2']]){const s=stats[k];if(!s)continue;const dt=new Date((obj.date||today())+'T00:00:00Z');dt.setUTCDate(dt.getUTCDate()-offset);out.push({date:dt.toISOString().slice(0,10),machine,modelName:m.model||'',big:N(s.big),reg:N(s.reg),totalG:N(s.totalGEst),diff:s.diff??null,ts:Date.now(),isFinal:offset>0,snapshotType:offset>0?'historical-final':'live'})}}return out}throw Error('未対応のJSON形式です。LABバックアップ（snapshots形式）が推奨です')}
function ingest(obj){let incoming=convert(obj).filter(r=>r&&r.date&&r.machine&&MACHINES.includes(String(r.machine).replace(/\D/g,'')));if(!incoming.length)throw Error('登録23台に一致するデータがありません');const seen=new Map(records.map(r=>[r.date+'|'+r.machine+'|'+r.ts,r]));for(const r of incoming)seen.set(r.date+'|'+r.machine+'|'+r.ts,r);records=[...seen.values()];localStorage.setItem(SKEY,JSON.stringify(records));$('status').textContent='✅ '+incoming.length+'件取込・保管合計 '+records.length+'件';analyze()}
$('import').onclick=()=>{try{ingest(JSON.parse($('paste').value));$('paste').value='';$('paste').classList.remove('show');$('importActions').style.display='none'}catch(e){$('status').textContent='⚠️ '+e.message}};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{ingest(JSON.parse(await f.text()))}catch(err){$('status').textContent='⚠️ '+err.message}e.target.value=''};
function analyze(){const date=$('day').value||today(),latest=new Map();for(const r of records){const id=r.date+'|'+String(r.machine).replace(/\D/g,'');if(!MACHINES.includes(id.split('|')[1])||r.demo)continue;const old=latest.get(id);if(!old||(final(r)&&!final(old))||(final(r)===final(old)&&N(r.ts)>=N(old.ts)))latest.set(id,r)}const all=[...latest.values()],history=all.filter(r=>final(r)&&age(date,r.date)>=1&&age(date,r.date)<=14),todays=all.filter(r=>r.date===date);last=MACHINES.map(machine=>{const old=history.filter(r=>String(r.machine).replace(/\D/g,'')===machine),now=todays.find(r=>String(r.machine).replace(/\D/g,'')===machine);if(mode==='morning'&&old.length<3||mode==='live'&&!now)return null;const pct=old.length?old.filter(r=>r.diff!=null&&N(r.diff)>0).length/old.length:0,avg=old.length?old.reduce((s,r)=>s+N(r.diff),0)/old.length:0;let score=50+clamp((pct-.4)*45,-15,15)+clamp(avg/180,-12,12),reason='過去'+old.length+'日 / プラス率 '+Math.round(pct*100)+'%';if(mode==='live'){const g=N(now.totalG),bb=N(now.big),rb=N(now.reg),diff=N(now.diff),comb=g?(bb+rb)/g:0;score=50+(score-50)*.25+clamp((comb-1/145)*3500,-22,22)+clamp(((g?rb/g:0)-1/300)*1500,-12,12)+clamp(diff/150,-13,13)-(g<800?13:0);reason=g+'G / BB'+bb+' RB'+rb+' / 差枚'+(diff>0?'+':'')+diff}return {machine,score:Math.round(clamp(score,0,100)),reason}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,3);$('results').innerHTML=last.length?last.map((r,i)=>'<div class="candidate"><div><b>'+(i+1)+'位　'+r.machine+'番</b><small style="display:block">'+r.reason+'</small></div><strong>'+r.score+'</strong></div>').join(''):'<div class="candidate">対象データが不足しています。収集JSONを取り込んでね。</div>';$('warning').textContent=mode==='morning'?'直近閉店記録：'+(history.map(r=>r.date).sort().at(-1)||'なし')+'（3日以上の履歴が必要）':'対象日LIVE：'+todays.length+'/23台（未取得台は除外）';$('save').disabled=!last.length}
$('save').onclick=()=>{if(!last.length)return;const p=load(PKEY,[]);p.push({mode,date:$('day').value,createdAt:new Date().toISOString(),ranking:last});localStorage.setItem(PKEY,JSON.stringify(p));$('status').textContent='📌 予想を保存しました（合計'+p.length+'件）'};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({kind:'pekalog-compact-backup',predictions:load(PKEY,[]),snapshots:records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pekalog_compact_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('clear').onclick=()=>{if(confirm('表示中の結果だけ消します。保存した履歴は残します。')){$('results').innerHTML='<div class="candidate">再分析ボタンで再表示</div>';last=[]}};analyze();
</script></body></html>
